<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo</title>
<meta name="theme-color" content="#1B4332">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --papel: #F7EFDB;
    --papel-2: #F0E6CC;
    --verde: #1B4332;
    --verde-2: #2D6A4F;
    --mostaza: #E3A72E;
    --mostaza-osc: #C68A1A;
    --texto: #2B2A25;
    --muted: #6B6656;
    --linea: #E0D4AE;
    --blanco: #FFFCF4;
    --rojo: #B23A24;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--papel); color: var(--texto);
    font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px; line-height: 1.5;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  h1, h2, .marca { font-family: 'Fraunces', Georgia, serif; }

  .cargando { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .spin { width: 34px; height: 34px; border: 3px solid var(--linea); border-top-color: var(--verde); border-radius: 50%; animation: girar .8s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }

  header {
    background: var(--verde); color: var(--blanco);
    padding: calc(22px + env(safe-area-inset-top, 0px)) 20px 22px;
    position: relative; overflow: hidden;
  }
  header::after {
    content: ''; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px;
    border-radius: 50%; background: var(--verde-2); opacity: .5;
  }
  .marca-fila { display: flex; align-items: center; gap: 12px; position: relative; }
  .logo-chico { width: 52px; height: 52px; border-radius: 12px; object-fit: cover; border: 2px solid rgba(255,255,255,.35); flex-shrink: 0; }
  .marca { font-size: 26px; font-weight: 600; margin: 0; line-height: 1.15; }
  .desc-chica { margin: 4px 0 0; font-size: 13px; color: #CFE3D6; }
  .btn-wpp-header {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; position: relative;
    background: var(--mostaza); color: #2B2100; border: none; padding: 9px 16px; border-radius: 8px;
    font-family: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
  }

  .buscador-wrap { padding: 14px 16px 0; }
  #buscador {
    width: 100%; padding: 11px 14px; border-radius: 9px; border: 1.5px solid var(--linea);
    background: var(--blanco); font-size: 14.5px; color: var(--texto); font-family: inherit;
  }
  #buscador:focus { outline: none; border-color: var(--verde-2); }

  .cats {
    display: flex; gap: 8px; overflow-x: auto; padding: 14px 16px 6px; scrollbar-width: none;
  }
  .cats::-webkit-scrollbar { display: none; }
  .cats button {
    flex-shrink: 0; border: 1.5px solid var(--linea); background: var(--blanco); color: var(--muted);
    padding: 7px 14px; border-radius: 7px; font-family: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer; white-space: nowrap;
  }
  .cats button.on { background: var(--verde); border-color: var(--verde); color: var(--blanco); }

  .lista { padding: 8px 16px 110px; }
  .cat-titulo {
    font-family: 'Fraunces', serif; font-size: 15px; font-weight: 600; color: var(--verde);
    margin: 22px 0 8px; padding-bottom: 6px; border-bottom: 2px solid var(--mostaza);
    display: inline-block;
  }
  .fila-prod {
    display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--linea);
  }
  .fila-foto {
    width: 54px; height: 54px; border-radius: 10px; object-fit: cover; flex-shrink: 0;
    background: var(--papel-2); border: 1px solid var(--linea);
  }
  .fila-info { flex: 1; min-width: 0; }
  .fila-nombre { font-size: 14.5px; font-weight: 500; color: var(--texto); }
  .fila-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .fila-precio-wrap { text-align: right; flex-shrink: 0; }
  .fila-precio-antes { font-size: 12px; color: var(--muted); text-decoration: line-through; }
  .fila-precio {
    font-family: 'Fraunces', serif; font-weight: 700; font-size: 17px; color: var(--verde);
    background: var(--mostaza); padding: 2px 8px; border-radius: 6px; display: inline-block;
  }
  .fila-precio.oferta { background: var(--rojo); color: var(--blanco); }
  .fila-agregar { margin-top: 6px; }
  .stepper {
    display: inline-flex; align-items: center; gap: 10px; background: var(--verde); color: var(--blanco);
    border-radius: 7px; padding: 4px 4px;
  }
  .stepper button {
    width: 24px; height: 24px; border: none; background: rgba(255,255,255,.18); color: var(--blanco);
    border-radius: 5px; font-size: 16px; cursor: pointer; font-family: inherit;
  }
  .stepper span { min-width: 16px; text-align: center; font-weight: 600; font-size: 13.5px; }
  .btn-mas {
    border: 1.5px solid var(--verde); background: transparent; color: var(--verde);
    padding: 5px 14px; border-radius: 7px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .sin-stock { color: var(--rojo); font-size: 12px; font-weight: 600; }
  .vacio { text-align: center; color: var(--muted); padding: 60px 20px; font-size: 14px; }

  .barra-carrito {
    position: fixed; left: 0; right: 0; bottom: 0; background: var(--verde); color: var(--blanco);
    padding: 14px 18px calc(14px + env(safe-area-inset-bottom, 0px));
    display: none; align-items: center; justify-content: space-between; cursor: pointer;
    box-shadow: 0 -4px 16px rgba(0,0,0,.18);
  }
  .barra-carrito.ver { display: flex; }
  .barra-carrito b { font-family: 'Fraunces', serif; font-size: 16px; }
  .barra-carrito .chip { background: var(--mostaza); color: #2B2100; border-radius: 20px; padding: 6px 16px; font-weight: 700; font-size: 14px; }

  .modal-bg {
    display: none; position: fixed; inset: 0; background: rgba(27,67,50,.55); z-index: 50;
    align-items: flex-end; justify-content: center;
  }
  .modal-bg.ver { display: flex; }
  .modal {
    background: var(--papel); width: 100%; max-width: 480px; border-radius: 18px 18px 0 0;
    padding: 22px 20px calc(22px + env(safe-area-inset-bottom, 0px)); max-height: 88vh; overflow-y: auto;
  }
  .modal h2 { margin: 0 0 14px; font-size: 19px; color: var(--verde); }
  .linea-carrito { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--linea); }
  .linea-carrito .nom { flex: 1; font-size: 14px; }
  .linea-carrito .pr { font-size: 13px; color: var(--muted); }
  .total-fila {
    display: flex; justify-content: space-between; align-items: center; margin: 16px 0;
    font-family: 'Fraunces', serif; font-size: 18px; font-weight: 700; color: var(--verde);
  }
  label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin: 12px 0 5px; }
  input[type=text], input[type=tel], textarea, select {
    width: 100%; padding: 11px 13px; border-radius: 9px; border: 1.5px solid var(--linea);
    background: var(--blanco); font-size: 14.5px; color: var(--texto); font-family: inherit;
  }
  textarea { resize: vertical; min-height: 60px; }
  .medios { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .medios button {
    border: 1.5px solid var(--linea); background: var(--blanco); color: var(--texto);
    padding: 8px 14px; border-radius: 8px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .medios button.on { background: var(--verde); border-color: var(--verde); color: var(--blanco); }
  .btn-ppal {
    width: 100%; background: var(--verde); color: var(--blanco); border: none; padding: 14px;
    border-radius: 10px; font-family: 'Fraunces', serif; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 16px;
  }
  .btn-ppal:disabled { opacity: .5; }
  .btn-sec {
    width: 100%; background: transparent; color: var(--muted); border: none; padding: 10px;
    font-family: inherit; font-size: 13.5px; cursor: pointer; text-align: center;
  }
  .msg-err {
    background: #F6DCD5; color: var(--rojo); padding: 10px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 10px;
  }
  .icono-ok { width: 56px; height: 56px; border-radius: 50%; background: var(--verde); color: var(--blanco);
    display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 14px; }
</style>
</head>
<body>

<div id="cargando" class="cargando"><div class="spin"></div></div>

<div id="app" style="display:none;">
  <header>
    <div class="marca-fila">
      <img id="logoChico" class="logo-chico" style="display:none;">
      <div>
        <h1 class="marca" id="nombreNegocio"></h1>
        <p class="desc-chica" id="descNegocio" style="display:none;"></p>
      </div>
    </div>
    <button class="btn-wpp-header" id="btnWppHeader">💬 Consultanos por WhatsApp</button>
  </header>

  <div class="buscador-wrap">
    <input type="text" id="buscador" placeholder="Buscá un producto...">
  </div>
  <div class="cats" id="cats"></div>

  <div class="lista" id="lista"></div>
</div>

<div class="barra-carrito" id="barraCarrito">
  <b id="barraCant">0 productos</b>
  <span class="chip" id="barraTotal">$0</span>
</div>

<!-- carrito -->
<div class="modal-bg" id="modalCarrito">
  <div class="modal">
    <h2>Tu pedido</h2>
    <div id="lineasCarrito"></div>
    <div class="total-fila"><span>Total</span><span id="totalCarrito">$0</span></div>
    <button class="btn-ppal" id="btnIrDatos">Continuar</button>
    <button class="btn-sec" id="btnCerrarCarrito">Seguir viendo el catálogo</button>
  </div>
</div>

<!-- datos del pedido -->
<div class="modal-bg" id="modalDatos">
  <div class="modal">
    <h2>Tus datos</h2>
    <div id="msgDatos"></div>
    <label>Tu nombre</label>
    <input type="text" id="fNombre" placeholder="Nombre y apellido">
    <label>Teléfono (opcional)</label>
    <input type="tel" id="fTelefono" placeholder="Ej: 11 5555-5555">
    <label id="lblDireccion" style="display:none;">Dirección de entrega</label>
    <input type="text" id="fDireccion" placeholder="Calle, número, piso/depto" style="display:none;">
    <label>Nota (opcional)</label>
    <textarea id="fNota" placeholder="Alguna aclaración para tu pedido"></textarea>
    <label>Cómo vas a pagar</label>
    <div class="medios" id="medios"></div>
    <button class="btn-ppal" id="btnEnviarPedido">Enviar pedido</button>
    <button class="btn-sec" id="btnVolverCarrito">Volver al pedido</button>
  </div>
</div>

<!-- confirmacion -->
<div class="modal-bg" id="modalListo">
  <div class="modal" style="text-align:center;">
    <div class="icono-ok">✓</div>
    <h2>Pedido enviado</h2>
    <p id="numeroPedido" style="color:var(--muted); margin:0 0 18px;"></p>
    <button class="btn-ppal" id="btnAvisarWpp">Avisar por WhatsApp</button>
    <button class="btn-sec" id="btnCerrarListo">Cerrar</button>
  </div>
</div>

<script>
const slug = location.pathname.split('/').filter(Boolean).pop();
const $ = id => document.getElementById(id);
const esc = s => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const plata = n => '$' + Math.round(n || 0).toLocaleString('es-AR');

let datos = null;
let carrito = {};       // productoId -> cantidad
let categoriaActiva = 'todas';
let formaPago = null;

async function cargar() {
  try {
    const r = await fetch('/api/catalogo/publico/' + slug);
    if (!r.ok) throw new Error();
    datos = await r.json();
  } catch (e) {
    document.body.innerHTML = '<div class="cargando"><p style="color:#6B6656;">No pudimos encontrar este catálogo.</p></div>';
    return;
  }
  $('cargando').style.display = 'none';
  $('app').style.display = 'block';

  $('nombreNegocio').textContent = datos.negocio.nombre || 'Catálogo';
  if (datos.negocio.descripcion) { $('descNegocio').textContent = datos.negocio.descripcion; $('descNegocio').style.display = 'block'; }
  if (datos.negocio.logo) { $('logoChico').src = datos.negocio.logo; $('logoChico').style.display = 'block'; }

  pintarCategorias();
  pintarLista();
  actualizarBarra();
}

function categorias() {
  const set = [];
  datos.productos.forEach(p => { if (p.categoria && set.indexOf(p.categoria) === -1) set.push(p.categoria); });
  return set;
}

function pintarCategorias() {
  const cats = categorias();
  if (cats.length < 2) { $('cats').style.display = 'none'; return; }
  $('cats').innerHTML = '<button class="on" data-c="todas">Todas</button>' +
    cats.map(c => '<button data-c="' + esc(c) + '">' + esc(c) + '</button>').join('');
  $('cats').querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      categoriaActiva = b.dataset.c;
      $('cats').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
      pintarLista();
    };
  });
}

function pintarLista() {
  const texto = ($('buscador').value || '').toLowerCase().trim();
  let items = datos.productos.filter(p => {
    if (categoriaActiva !== 'todas' && p.categoria !== categoriaActiva) return false;
    if (texto && p.nombre.toLowerCase().indexOf(texto) === -1) return false;
    return true;
  });

  if (items.length === 0) { $('lista').innerHTML = '<div class="vacio">No encontramos productos.</div>'; return; }

  // agrupar por categoria solo si se estan viendo todas
  let html = '';
  let catAnterior = null;
  items.forEach(p => {
    if (categoriaActiva === 'todas' && p.categoria !== catAnterior) {
      html += '<div class="cat-titulo">' + esc(p.categoria || 'Otros') + '</div>';
      catAnterior = p.categoria;
    }
    html += filaProducto(p);
  });
  $('lista').innerHTML = html;

  items.forEach(p => {
    const menos = document.getElementById('menos_' + p.id);
    const mas = document.getElementById('mas_' + p.id);
    const btnAgregar = document.getElementById('agregar_' + p.id);
    if (menos) menos.onclick = () => cambiarCantidad(p.id, -1);
    if (mas) mas.onclick = () => cambiarCantidad(p.id, 1);
    if (btnAgregar) btnAgregar.onclick = () => cambiarCantidad(p.id, 1);
  });
}

function filaProducto(p) {
  const cant = carrito[p.id] || 0;
  const tieneOferta = p.precio_oferta && p.precio_oferta > 0 && p.precio_oferta < p.precio_venta;
  const precioFinal = tieneOferta ? p.precio_oferta : p.precio_venta;
  const sinStock = p.stock != null && p.stock <= 0 && !p.es_servicio;

  return '<div class="fila-prod">' +
    (p.foto ? '<img class="fila-foto" src="' + esc(p.foto) + '">' : '<div class="fila-foto"></div>') +
    '<div class="fila-info">' +
      '<div class="fila-nombre">' + esc(p.nombre) + '</div>' +
      (p.notas ? '<div class="fila-sub">' + esc(p.notas) + '</div>' : '') +
      (sinStock ? '<div class="sin-stock">Sin stock</div>' : '') +
    '</div>' +
    '<div class="fila-precio-wrap">' +
      (tieneOferta ? '<div class="fila-precio-antes">' + plata(p.precio_venta) + '</div>' : '') +
      '<div class="fila-precio' + (tieneOferta ? ' oferta' : '') + '">' + plata(precioFinal) + (p.unidad && p.unidad !== 'unidad' ? ' /' + esc(p.unidad) : '') + '</div>' +
      '<div class="fila-agregar">' +
        (sinStock ? '' : cant > 0
          ? '<div class="stepper"><button id="menos_' + p.id + '">−</button><span>' + cant + '</span><button id="mas_' + p.id + '">+</button></div>'
          : '<button class="btn-mas" id="agregar_' + p.id + '">Agregar</button>') +
      '</div>' +
    '</div>' +
  '</div>';
}

function cambiarCantidad(id, delta) {
  const actual = carrito[id] || 0;
  const nueva = Math.max(0, actual + delta);
  if (nueva === 0) delete carrito[id]; else carrito[id] = nueva;
  pintarLista();
  actualizarBarra();
}

function totalCarrito() {
  let total = 0, cant = 0;
  Object.keys(carrito).forEach(id => {
    const p = datos.productos.filter(x => x.id === id)[0];
    if (!p) return;
    const tieneOferta = p.precio_oferta && p.precio_oferta > 0 && p.precio_oferta < p.precio_venta;
    total += (tieneOferta ? p.precio_oferta : p.precio_venta) * carrito[id];
    cant += carrito[id];
  });
  return { total, cant };
}

function actualizarBarra() {
  const { total, cant } = totalCarrito();
  $('barraCarrito').classList.toggle('ver', cant > 0);
  $('barraCant').textContent = cant + (cant === 1 ? ' producto' : ' productos');
  $('barraTotal').textContent = plata(total);
}

$('buscador').addEventListener('input', pintarLista);
$('barraCarrito').onclick = abrirCarrito;

function abrirCarrito() {
  const { total } = totalCarrito();
  $('lineasCarrito').innerHTML = Object.keys(carrito).map(id => {
    const p = datos.productos.filter(x => x.id === id)[0];
    if (!p) return '';
    const tieneOferta = p.precio_oferta && p.precio_oferta > 0 && p.precio_oferta < p.precio_venta;
    const precio = tieneOferta ? p.precio_oferta : p.precio_venta;
    return '<div class="linea-carrito"><span class="nom">' + carrito[id] + ' × ' + esc(p.nombre) + '</span><span class="pr">' + plata(precio * carrito[id]) + '</span></div>';
  }).join('');
  $('totalCarrito').textContent = plata(total);
  $('modalCarrito').classList.add('ver');
}
$('btnCerrarCarrito').onclick = () => $('modalCarrito').classList.remove('ver');

$('btnIrDatos').onclick = () => {
  $('modalCarrito').classList.remove('ver');
  const medios = [];
  if (datos.negocio.acepta_efectivo) medios.push(['efectivo', 'Efectivo']);
  if (datos.negocio.acepta_transferencia) medios.push(['transferencia', 'Transferencia']);
  if (datos.negocio.acepta_mercadopago) medios.push(['mercadopago', 'Mercado Pago']);
  if (medios.length === 0) medios.push(['efectivo', 'Efectivo']);
  formaPago = medios[0][0];
  $('medios').innerHTML = medios.map((m, i) =>
    '<button data-m="' + m[0] + '" class="' + (i === 0 ? 'on' : '') + '">' + m[1] + '</button>').join('');
  $('medios').querySelectorAll('button').forEach(b => {
    b.onclick = () => {
      formaPago = b.dataset.m;
      $('medios').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    };
  });
  $('modalDatos').classList.add('ver');
};
$('btnVolverCarrito').onclick = () => { $('modalDatos').classList.remove('ver'); abrirCarrito(); };

$('btnEnviarPedido').onclick = async () => {
  const nombre = $('fNombre').value.trim();
  if (!nombre) { $('msgDatos').innerHTML = '<div class="msg-err">Contanos tu nombre.</div>'; return; }
  const btn = $('btnEnviarPedido');
  btn.disabled = true; btn.textContent = 'Enviando...';

  try {
    const items = Object.keys(carrito).map(id => ({ productoId: id, cantidad: carrito[id] }));
    const r = await fetch('/api/pedidos/publico/' + slug, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        nombre: nombre,
        telefono: $('fTelefono').value.trim() || null,
        direccion: $('fDireccion').value.trim() || null,
        nota: $('fNota').value.trim() || null,
        formaPago: formaPago,
        items: items
      })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'No se pudo enviar el pedido.');

    if (d.initPoint) { window.location.href = d.initPoint; return; }

    $('modalDatos').classList.remove('ver');
    $('numeroPedido').textContent = 'Número ' + d.numero;
    $('modalListo').classList.add('ver');

    const wpp = (datos.negocio.whatsapp || '').replace(/\D/g, '');
    const t = 'Hola! Te hago un pedido (N ' + d.numero + '), de ' + nombre + '.';
    $('btnAvisarWpp').onclick = () => {
      window.open(wpp ? 'https://wa.me/54' + wpp + '?text=' + encodeURIComponent(t)
                       : 'https://wa.me/?text=' + encodeURIComponent(t), '_blank');
    };
  } catch (e) {
    $('msgDatos').innerHTML = '<div class="msg-err">' + esc(e.message) + '</div>';
  }
  btn.disabled = false; btn.textContent = 'Enviar pedido';
};

$('btnCerrarListo').onclick = () => {
  $('modalListo').classList.remove('ver');
  carrito = {};
  pintarLista();
  actualizarBarra();
  window.location.reload();
};

$('btnWppHeader').onclick = () => {
  const wpp = (datos.negocio.whatsapp || '').replace(/\D/g, '');
  const t = datos.negocio.mensaje || ('Hola! Te escribo desde tu catálogo de ' + datos.negocio.nombre + '.');
  window.open(wpp ? 'https://wa.me/54' + wpp + '?text=' + encodeURIComponent(t)
                   : 'https://wa.me/?text=' + encodeURIComponent(t), '_blank');
};

cargar();
</script>
</body>
</html>
