<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Negocios en CajaViva</title>
<meta name="theme-color" content="#1D9E75">
<link rel="icon" href="/favicon.ico">
<style>
  :root {
    --bg: #FAFAF7; --panel: #FFFFFF; --panel-2: #F3F2EE;
    --line: #E4E2DA; --text: #2C2C2A; --muted: #6E6D67;
    --accent: #1D9E75; --accent-dark: #0F6E56; --accent-soft: #E1F5EE;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 15px;
  }

  header {
    background: var(--accent); color: #fff;
    padding: 20px 18px 22px;
    border-radius: 0 0 20px 20px;
  }
  .marca { font-size: 21px; font-weight: 500; }
  .marca span { font-weight: 700; }
  .sub { font-size: 13.5px; opacity: .85; margin-top: 3px; }

  .buscar-wrap { margin-top: 16px; }
  .buscar-wrap input {
    width: 100%; padding: 11px 16px; border-radius: 22px;
    border: none; background: #fff; color: #333; font-size: 15px;
  }
  .buscar-wrap input::placeholder { color: #B0B0B0; }

  .cont { max-width: 900px; margin: 0 auto; padding: 16px 14px 40px; }

  .chips {
    display: flex; gap: 7px; overflow-x: auto; padding: 14px 0 4px;
    scrollbar-width: none;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chips button {
    flex-shrink: 0; padding: 5px 11px; border-radius: 16px; min-height: 27px;
    border: 1px solid var(--line); background: var(--panel);
    color: var(--muted); font-size: 12px; font-weight: 500; white-space: nowrap;
  }
  .chips button.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  .grilla {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px; margin-top: 14px;
  }
  .negocio {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); overflow: hidden;
    text-decoration: none; color: inherit; display: block;
  }
  .negocio .portada {
    height: 92px; background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center;
    color: var(--accent-dark); font-size: 30px; font-weight: 600;
  }
  .negocio .portada img { width: 100%; height: 100%; object-fit: cover; }
  .negocio .datos { padding: 12px 14px 14px; }
  .negocio .n { font-size: 15px; font-weight: 500; }
  .negocio .r { font-size: 12.5px; color: var(--muted); margin-top: 2px; text-transform: capitalize; }
  .negocio .p { font-size: 11.5px; color: var(--accent-dark); margin-top: 6px; }

  .vacio { text-align: center; color: var(--muted); padding: 50px 20px; font-size: 14px; }

  footer {
    text-align: center; padding: 26px 20px 34px;
    color: var(--muted); font-size: 12.5px;
  }
  footer a { color: var(--accent-dark); font-weight: 500; }
</style>
</head>
<body>

<header>
  <div class="cont" style="padding:0 4px;">
    <div class="marca">Caja<span>Viva</span></div>
    <div class="sub">Negocios que venden con nosotros</div>
    <div class="buscar-wrap">
      <input type="text" id="buscar" placeholder="Buscar un negocio..." autocomplete="off">
    </div>
  </div>
</header>

<div class="cont">
  <div class="chips" id="chips"></div>
  <div id="lista"><div class="vacio">Cargando...</div></div>
</div>

<footer>
  Tenes un negocio? <a href="/">Abri tu catalogo gratis</a>
</footer>

<script>
let datos = { negocios: [], rubros: [] };
let filtro = '';

const NOMBRES = {
  kiosco: 'Kiosco', almacen: 'Almacen', minimercado: 'Minimercado',
  libreria: 'Libreria', ferreteria: 'Ferreteria', bazar: 'Bazar',
  ropa: 'Ropa', calzado: 'Calzado', peluqueria: 'Peluqueria',
  barberia: 'Barberia', odontologia: 'Odontologia', tatuajes: 'Tatuajes',
  rotiseria: 'Rotiseria', panaderia: 'Panaderia', cabanas: 'Cabañas',
  canchas_alq: 'Canchas', kinesiologia: 'Kinesiologia', verduleria: 'Verduleria',
  carniceria: 'Carniceria', petshop: 'Pet shop', vivero: 'Vivero'
};

function esc(t) {
  const d = document.createElement('div');
  d.textContent = t == null ? '' : t;
  return d.innerHTML;
}

function nombreRubro(r) {
  return NOMBRES[r] || (r ? r.charAt(0).toUpperCase() + r.slice(1).replace(/_/g, ' ') : 'Otros');
}

async function cargar() {
  try {
    const r = await fetch('/api/catalogo/directorio');
    datos = await r.json();
    pintarChips();
    pintar();
  } catch (e) {
    document.getElementById('lista').innerHTML =
      '<div class="vacio">No se pudieron cargar los negocios.</div>';
  }
}

function pintarChips() {
  const c = document.getElementById('chips');
  const conNegocios = datos.rubros.filter(function (r) {
    return datos.negocios.some(function (n) { return n.rubro === r.rubro; });
  });

  if (conNegocios.length < 2) { c.innerHTML = ''; return; }

  c.innerHTML =
    '<button class="' + (filtro === '' ? 'on' : '') + '" onclick="filtrar(\'\')">Todos</button>' +
    conNegocios.map(function (r) {
      return '<button class="' + (filtro === r.rubro ? 'on' : '') + '" ' +
        'onclick="filtrar(\'' + r.rubro + '\')">' + esc(nombreRubro(r.rubro)) + '</button>';
    }).join('');
}

function filtrar(r) { filtro = r; pintarChips(); pintar(); }

function pintar() {
  const t = document.getElementById('buscar').value.trim().toLowerCase();
  let lista = datos.negocios;

  if (filtro) lista = lista.filter(function (n) { return n.rubro === filtro; });
  if (t) lista = lista.filter(function (n) { return (n.nombre || '').toLowerCase().indexOf(t) >= 0; });

  if (lista.length === 0) {
    document.getElementById('lista').innerHTML =
      '<div class="vacio">No encontramos negocios con eso.</div>';
    return;
  }

  document.getElementById('lista').innerHTML =
    '<div class="grilla">' + lista.map(function (n) {
      const inicial = (n.nombre || '?').charAt(0).toUpperCase();
      return '<a class="negocio" href="/c/' + encodeURIComponent(n.slug) + '">' +
        '<div class="portada">' +
        (n.banner ? '<img src="' + n.banner + '" loading="lazy">' : esc(inicial)) +
        '</div>' +
        '<div class="datos">' +
        '<div class="n">' + esc(n.nombre) + '</div>' +
        '<div class="r">' + esc(nombreRubro(n.rubro)) + '</div>' +
        '<div class="p">' + n.productos + (n.productos === 1 ? ' producto' : ' productos') + '</div>' +
        '</div></a>';
    }).join('') + '</div>';
}

document.getElementById('buscar').addEventListener('input', pintar);
cargar();
</script>
</body>
</html>
