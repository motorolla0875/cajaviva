<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalogo</title>
<meta name="theme-color" content="#1D9E75">
<style>
  :root {
    --bg: #FAFAF7; --panel: #FFFFFF; --panel-2: #F3F2EE;
    --line: #E4E2DA; --text: #2C2C2A; --muted: #6E6D67;
    --accent: #1D9E75; --accent-dark: #0F6E56; --accent-soft: #E1F5EE;
    --radius: 12px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5;
    padding-bottom: 90px;
  }
  header {
    background: var(--panel); border-bottom: 1px solid var(--line);
    padding: 18px 18px; text-align: center; position: sticky; top: 0; z-index: 10;
  }
  @media (max-width: 380px) {
    header { padding: 14px 14px; }
    header h1 { font-size: 18px; }
    .cont { padding: 12px; }
    .prod { padding: 11px 12px; gap: 8px; }
    .prod .info .n { font-size: 14px; }
  }
  header h1 { margin: 0; font-size: 21px; font-weight: 500; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13.5px; }

  .cont { max-width: 640px; margin: 0 auto; padding: 16px; }

  .grilla-prod { display: block; }

  @media (min-width: 820px) {
    .cont { max-width: 1000px; }
    .grilla-prod {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 14px;
    }
    .prod { margin-bottom: 10px; }
  }
  @media (min-width: 1280px) {
    .cont { max-width: 1240px; }
    .grilla-prod { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

  .buscador { margin-bottom: 14px; }
  .buscador input {
    width: 100%; padding: 13px 14px;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--panel); font-size: 15px; color: var(--text);
  }
  .buscador input:focus { outline: none; border-color: var(--accent); }

  .chips { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 12px; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button {
    flex-shrink: 0; padding: 8px 14px; border-radius: 20px;
    border: 1px solid var(--line); background: var(--panel);
    color: var(--muted); font-size: 13px; font-weight: 500; white-space: nowrap;
  }
  .chips button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-dark); }

  .cat-titulo { font-size: 13px; font-weight: 500; color: var(--muted); margin: 18px 0 8px; }

  .prod {
    display: flex; align-items: center; gap: 12px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 13px 14px; margin-bottom: 8px;
    overflow: hidden; max-width: 100%;
  }
  .prod .info { flex: 1 1 auto; min-width: 0; overflow: hidden; }
  .foto-cat {
    width: 56px; height: 56px; flex-shrink: 0; border-radius: 9px;
    object-fit: cover; background: var(--panel-2); cursor: pointer;
  }
  .prod .info .n { font-weight: 500; font-size: 15px; }
  .prod .info .p { color: var(--accent); font-weight: 500; font-size: 16px; margin-top: 2px; }
  .prod .ctrl { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .prod .ctrl button {
    width: 34px; height: 34px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--panel-2);
    color: var(--text); font-size: 17px; line-height: 1;
  }
  .prod .ctrl .n { min-width: 24px; text-align: center; font-weight: 500; }
  .prod .btn-sumar {
    width: 40px; height: 40px; flex-shrink: 0;
    border-radius: 10px; border: 1px solid var(--accent);
    background: var(--accent-soft); color: var(--accent-dark);
    font-size: 22px; font-weight: 500; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .prod .info .n {
    overflow-wrap: anywhere;
  }

  @media (max-width: 420px) {
    .prod { gap: 8px; padding: 12px; }
    .prod .ctrl button { width: 32px; height: 32px; }
    .prod .btn-sumar { width: 36px; height: 36px; }
  }

  .barra {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--panel); border-top: 1px solid var(--line);
    padding: 12px 16px 16px;
  }
  .barra .cont-b { max-width: 640px; margin: 0 auto; }
  .barra .fila { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .barra .fila span { color: var(--muted); font-size: 13px; }
  .barra .fila b { font-size: 22px; font-weight: 500; }
  .barra button {
    width: 100%; padding: 15px; border: none; border-radius: var(--radius);
    background: var(--accent); color: #fff; font-size: 15px; font-weight: 500;
  }
  .barra button:disabled { background: var(--line); color: var(--muted); }

  .vacio { text-align: center; color: var(--muted); padding: 50px 20px; }
</style>
</head>
<body>

<header>
  <h1 id="nombreNeg">Cargando...</h1>
  <p id="mensajeNeg"></p>
</header>

<div class="cont">
  <div class="buscador">
    <input type="text" id="buscar" placeholder="Buscar producto..." autocomplete="off">
  </div>
  <div class="chips" id="chips"></div>
  <div id="lista"><div class="vacio">Cargando productos...</div></div>
</div>

<div class="barra" id="barra" style="display:none;">
  <div class="cont-b">
    <div class="fila"><span id="cantPedido">0 productos</span><b id="totalPedido">$0</b></div>
    <button id="btnPedir">Enviar pedido</button>
  </div>
</div>

<div id="modalPedido" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:50; overflow-y:auto; padding:20px 16px;">
  <div style="background:var(--panel); border-radius:16px; max-width:420px; margin:0 auto; padding:22px;">
    <h3 style="margin:0 0 4px; font-size:19px; font-weight:500;">Tu pedido</h3>
    <p style="color:var(--muted); font-size:13.5px; margin:0 0 16px;" id="resumenPedido"></p>
    <div id="msgPedido"></div>

    <label style="display:block; font-size:12.5px; color:var(--muted); margin:0 0 5px; font-weight:500;">Tu nombre</label>
    <input type="text" id="pdNombre" style="width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); font-size:15px;">

    <label style="display:block; font-size:12.5px; color:var(--muted); margin:12px 0 5px; font-weight:500;">Tu telefono</label>
    <input type="text" id="pdTelefono" inputmode="tel" style="width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); font-size:15px;">

    <label style="display:block; font-size:12.5px; color:var(--muted); margin:12px 0 5px; font-weight:500;">Direccion (si queres envio)</label>
    <input type="text" id="pdDireccion" style="width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); font-size:15px;">

    <label style="display:block; font-size:12.5px; color:var(--muted); margin:12px 0 5px; font-weight:500;">Como vas a pagar</label>
    <div id="formasPago" style="display:flex; gap:6px;"></div>

    <div id="datosTransfer" style="display:none; background:var(--accent-soft); border-radius:10px; padding:14px; margin-top:12px;">
      <div style="font-size:12px; color:var(--accent-dark);">Transferí a este alias</div>
      <div style="font-size:19px; font-weight:500; color:var(--accent-dark); margin:4px 0;" id="aliasPago"></div>
      <div style="font-size:12.5px; color:var(--accent-dark);" id="titularPago"></div>
      <button onclick="copiarAlias()" style="width:100%; margin-top:10px; padding:9px; border:1px solid var(--accent); border-radius:9px; background:var(--panel); color:var(--accent-dark); font-size:13px; font-weight:500;">Copiar alias</button>
    </div>

    <label style="display:block; font-size:12.5px; color:var(--muted); margin:12px 0 5px; font-weight:500;">Aclaraciones (opcional)</label>
    <input type="text" id="pdNota" style="width:100%; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); font-size:15px;">

    <button id="btnEnviarPedido" style="width:100%; padding:15px; margin-top:18px; border:none; border-radius:12px; background:var(--accent); color:#fff; font-size:15px; font-weight:500;">Enviar el pedido</button>
    <button onclick="cerrarPedido()" style="width:100%; padding:12px; margin-top:8px; border:none; background:none; color:var(--muted); font-size:14px;">Volver</button>
  </div>
</div>

<div id="modalListo" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:60; padding:20px 16px;">
  <div style="background:var(--panel); border-radius:16px; max-width:360px; margin:40px auto 0; padding:26px; text-align:center;">
    <div style="width:62px; height:62px; margin:0 auto; border:3px solid var(--accent); border-radius:50%; color:var(--accent); font-size:32px; line-height:56px;">&#10003;</div>
    <h3 style="margin:14px 0 4px; font-size:20px; font-weight:500;">Pedido enviado</h3>
    <p style="color:var(--muted); font-size:14px; margin:0 0 6px;" id="numeroPedido"></p>
    <p style="color:var(--muted); font-size:13.5px; margin:0 0 18px;">Te van a contactar para confirmarlo.</p>

    <div id="zonaComprobante" style="display:none; background:var(--accent-soft); border-radius:12px; padding:16px; margin-bottom:14px; text-align:left;">
      <div style="font-size:13.5px; color:var(--accent-dark); font-weight:500; margin-bottom:4px;">Ya transferiste?</div>
      <div style="font-size:12.5px; color:var(--accent-dark); margin-bottom:10px;">Mandanos el comprobante asi lo confirmamos mas rapido.</div>
      <div id="prevComp" style="display:none; margin-bottom:10px;">
        <img id="imgComp" style="width:100%; border-radius:9px;">
      </div>
      <button id="btnSubirComp" style="width:100%; padding:12px; border:1px solid var(--accent); border-radius:10px; background:var(--panel); color:var(--accent-dark); font-size:14px; font-weight:500;">Subir comprobante</button>
      <input type="file" id="archComp" accept="image/*" style="display:none;">
    </div>

    <button id="btnAvisarWpp" style="width:100%; padding:14px; border:none; border-radius:12px; background:var(--accent); color:#fff; font-size:15px; font-weight:500;">Avisar por WhatsApp</button>
    <button onclick="location.reload()" style="width:100%; padding:12px; margin-top:8px; border:none; background:none; color:var(--muted); font-size:14px;">Hacer otro pedido</button>
  </div>
</div>

<script>
const slug = decodeURIComponent(location.pathname.replace(/\/+$/, '').split('/').filter(Boolean).pop() || '');
let datos = null, pedido = {}, filtro = '';

const $ = id => document.getElementById(id);
const plata = n => '$' + Math.round(n || 0).toLocaleString('es-AR');
const norm = s => (s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

async function cargar() {
  try {
    const r = await fetch('/api/catalogo/publico/' + slug);
    if (!r.ok) throw new Error('no existe');
    datos = await r.json();

    document.title = datos.negocio.nombre;
    $('nombreNeg').textContent = datos.negocio.nombre;
    $('mensajeNeg').textContent = datos.negocio.mensaje || 'Mira nuestros precios y hace tu pedido';

    pintarChips();
    pintar();
  } catch (e) {
    $('lista').innerHTML = '<div class="vacio">Este catalogo no esta disponible.</div>';
    $('nombreNeg').textContent = 'Catalogo';
  }
}

function categorias() {
  const cs = [];
  datos.productos.forEach(function (p) {
    const c = p.categoria || 'Otros';
    if (cs.indexOf(c) < 0) cs.push(c);
  });
  return cs;
}

function pintarChips() {
  const cs = categorias();
  if (cs.length < 2) { $('chips').innerHTML = ''; return; }
  $('chips').innerHTML =
    '<button class="' + (filtro === '' ? 'on' : '') + '" onclick="filtrar(\'\')">Todos</button>' +
    cs.map(function (c) {
      return '<button class="' + (filtro === c ? 'on' : '') + '" onclick="filtrar(\'' + esc(c).replace(/'/g, "") + '\')">' + esc(c) + '</button>';
    }).join('');
}

function filtrar(c) { filtro = c; pintarChips(); pintar(); }

function pintar() {
  const t = norm($('buscar').value.trim());
  let lista = datos.productos;
  if (filtro) lista = lista.filter(function (p) { return (p.categoria || 'Otros') === filtro; });
  if (t) lista = lista.filter(function (p) { return norm(p.nombre).indexOf(t) >= 0; });

  if (lista.length === 0) {
    $('lista').innerHTML = '<div class="vacio">No encontramos nada.</div>';
    return;
  }

  function tarjeta(p) {
    const c = pedido[p.id] || 0;
    return '<div class="prod">' +
      (p.foto ? '<img class="foto-cat" src="' + p.foto + '" loading="lazy" onclick="verFoto(\'' + (p.foto_grande || p.foto) + '\')">' : '') +
      '<div class="info">' +
      '<div class="n">' + esc(p.nombre) + '</div>' +
      '<div class="p">' + plata(p.precio_venta) + (p.unidad !== 'unidad' ? ' /' + p.unidad : '') + '</div></div>' +
      '<div class="ctrl">' +
      (c > 0
        ? '<button onclick="cambiar(\'' + p.id + '\',-1)">-</button><span class="n">' + c + '</span><button onclick="cambiar(\'' + p.id + '\',1)">+</button>'
        : '<button class="btn-sumar" onclick="cambiar(\'' + p.id + '\',1)">+</button>') +
      '</div></div>';
  }

  let html = '';

  if (filtro) {
    html = '<div class="grilla-prod">' + lista.map(tarjeta).join('') + '</div>';
  } else {
    const grupos = {};
    const orden = [];
    lista.forEach(function (p) {
      const cat = p.categoria || 'Otros';
      if (!grupos[cat]) { grupos[cat] = []; orden.push(cat); }
      grupos[cat].push(p);
    });
    orden.forEach(function (cat) {
      html += '<div class="cat-titulo">' + esc(cat) + '</div>' +
        '<div class="grilla-prod">' + grupos[cat].map(tarjeta).join('') + '</div>';
    });
  }

  $('lista').innerHTML = html;
}

function cambiar(id, d) {
  pedido[id] = (pedido[id] || 0) + d;
  if (pedido[id] <= 0) delete pedido[id];
  pintar();
  actualizarBarra();
}

function actualizarBarra() {
  const ids = Object.keys(pedido);
  if (ids.length === 0) { $('barra').style.display = 'none'; return; }

  let total = 0, cant = 0;
  ids.forEach(function (id) {
    const p = datos.productos.filter(function (x) { return x.id === id; })[0];
    if (!p) return;
    total += p.precio_venta * pedido[id];
    cant += pedido[id];
  });

  $('barra').style.display = 'block';
  $('cantPedido').textContent = cant + (cant === 1 ? ' producto' : ' productos');
  $('totalPedido').textContent = plata(total);
}

let formaPago = 'efectivo';

function textoPedido() {
  let t = 'Hola! Hice un pedido:\n\n';
  let total = 0;
  Object.keys(pedido).forEach(function (id) {
    const p = datos.productos.filter(function (x) { return x.id === id; })[0];
    if (!p) return;
    const sub = p.precio_venta * pedido[id];
    total += sub;
    t += pedido[id] + ' x ' + p.nombre + ' - ' + plata(sub) + '\n';
  });
  t += '\nTotal: ' + plata(total);
  return t;
}

$('btnPedir').onclick = function () {
  if (Object.keys(pedido).length === 0) return;

  let total = 0, cant = 0;
  Object.keys(pedido).forEach(function (id) {
    const p = datos.productos.filter(function (x) { return x.id === id; })[0];
    if (!p) return;
    total += p.precio_venta * pedido[id];
    cant += pedido[id];
  });

  $('resumenPedido').textContent = cant + (cant === 1 ? ' producto - ' : ' productos - ') + plata(total);
  $('msgPedido').innerHTML = '';

  const f = [];
  if (datos.negocio.acepta_efectivo !== 0) f.push(['efectivo', 'Efectivo']);
  if (datos.negocio.acepta_transferencia && datos.negocio.alias_pago) f.push(['transferencia', 'Transferencia']);
  if (f.length === 0) f.push(['efectivo', 'Efectivo']);

  formaPago = f[0][0];
  $('formasPago').innerHTML = f.map(function (x, i) {
    return '<button onclick="elegirPago(\'' + x[0] + '\')" data-f="' + x[0] + '" ' +
      'style="flex:1; padding:11px; border-radius:10px; font-size:13.5px; font-weight:500; ' +
      'border:1px solid ' + (i === 0 ? 'var(--accent)' : 'var(--line)') + '; ' +
      'background:' + (i === 0 ? 'var(--accent-soft)' : 'var(--panel)') + '; ' +
      'color:' + (i === 0 ? 'var(--accent-dark)' : 'var(--muted)') + ';">' + x[1] + '</button>';
  }).join('');

  $('aliasPago').textContent = datos.negocio.alias_pago || '';
  $('titularPago').textContent = datos.negocio.titular_pago ? 'A nombre de ' + datos.negocio.titular_pago : '';
  $('datosTransfer').style.display = formaPago === 'transferencia' ? 'block' : 'none';

  $('modalPedido').style.display = 'block';
};

function elegirPago(f) {
  formaPago = f;
  Array.prototype.forEach.call($('formasPago').children, function (b) {
    const on = b.dataset.f === f;
    b.style.borderColor = on ? 'var(--accent)' : 'var(--line)';
    b.style.background = on ? 'var(--accent-soft)' : 'var(--panel)';
    b.style.color = on ? 'var(--accent-dark)' : 'var(--muted)';
  });
  $('datosTransfer').style.display = f === 'transferencia' ? 'block' : 'none';
}

function cerrarPedido() { $('modalPedido').style.display = 'none'; }

function copiarAlias() {
  const a = datos.negocio.alias_pago || '';
  navigator.clipboard.writeText(a).then(function () {
    alert('Alias copiado: ' + a);
  }).catch(function () { alert('Alias: ' + a); });
}

$('btnEnviarPedido').onclick = async function () {
  const nombre = $('pdNombre').value.trim();
  if (!nombre) { $('msgPedido').innerHTML = '<div style="background:#FBEAEA; color:#C0392B; padding:10px 12px; border-radius:9px; font-size:13px; margin-bottom:12px;">Poné tu nombre.</div>'; return; }

  const btn = $('btnEnviarPedido');
  btn.disabled = true; btn.textContent = 'Enviando...';

  try {
    const items = Object.keys(pedido).map(function (id) {
      return { productoId: id, cantidad: pedido[id] };
    });

    const r = await fetch('/api/pedidos/publico/' + slug, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        nombre: nombre,
        telefono: $('pdTelefono').value.trim() || null,
        direccion: $('pdDireccion').value.trim() || null,
        nota: $('pdNota').value.trim() || null,
        formaPago: formaPago,
        items: items
      })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'No se pudo enviar');

    pedidoCreado = d.id;
    $('numeroPedido').textContent = 'Numero ' + d.numero;
    document.getElementById('zonaComprobante').style.display =
      formaPago === 'transferencia' ? 'block' : 'none';
    $('modalPedido').style.display = 'none';
    $('modalListo').style.display = 'block';

    const wpp = (datos.negocio.whatsapp || '').replace(/\D/g, '');
    const t = textoPedido() + '\n\nPedido N ' + d.numero + '\nDe: ' + nombre;
    $('btnAvisarWpp').onclick = function () {
      window.open(wpp ? 'https://wa.me/54' + wpp + '?text=' + encodeURIComponent(t)
                      : 'https://wa.me/?text=' + encodeURIComponent(t), '_blank');
    };
  } catch (e) {
    $('msgPedido').innerHTML = '<div style="background:#FBEAEA; color:#C0392B; padding:10px 12px; border-radius:9px; font-size:13px; margin-bottom:12px;">' + esc(e.message) + '</div>';
  }
  btn.disabled = false; btn.textContent = 'Enviar el pedido';
};

let pedidoCreado = null;

function comprimirComp(archivo, ladoMax, calidad) {
  return new Promise(function (resolver, fallar) {
    const lector = new FileReader();
    lector.onload = function (e) {
      const img = new Image();
      img.onload = function () {
        let w = img.width, h = img.height;
        if (w > h) { if (w > ladoMax) { h = h * (ladoMax / w); w = ladoMax; } }
        else { if (h > ladoMax) { w = w * (ladoMax / h); h = ladoMax; } }
        const c = document.createElement('canvas');
        c.width = Math.round(w); c.height = Math.round(h);
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(function (b) { b ? resolver(b) : fallar(new Error('error')); }, 'image/webp', calidad);
      };
      img.onerror = function () { fallar(new Error('No se pudo leer')); };
      img.src = e.target.result;
    };
    lector.readAsDataURL(archivo);
  });
}

document.getElementById('btnSubirComp').onclick = function () {
  document.getElementById('archComp').click();
};

document.getElementById('archComp').onchange = async function (e) {
  const f = e.target.files[0];
  if (!f || !pedidoCreado) return;

  const btn = document.getElementById('btnSubirComp');
  btn.disabled = true; btn.textContent = 'Subiendo...';

  try {
    const chica = await comprimirComp(f, 900, 0.75);
    const fd = new FormData();
    fd.append('foto', chica, 'comp.webp');

    const r = await fetch('/api/fotos/comprobante/' + pedidoCreado, { method: 'POST', body: fd });
    if (!r.ok) throw new Error('No se pudo subir');

    document.getElementById('imgComp').src = URL.createObjectURL(chica);
    document.getElementById('prevComp').style.display = 'block';
    btn.textContent = 'Comprobante enviado';
    btn.style.background = 'var(--accent)';
    btn.style.color = '#fff';
  } catch (err) {
    alert('No se pudo subir el comprobante');
    btn.disabled = false; btn.textContent = 'Subir comprobante';
  }
};

function verFoto(url) {
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;';
  d.innerHTML = '<img src="' + url + '" style="max-width:100%;max-height:100%;border-radius:12px;">';
  d.onclick = function () { d.remove(); };
  document.body.appendChild(d);
}

$('buscar').addEventListener('input', pintar);
cargar();
</script>
