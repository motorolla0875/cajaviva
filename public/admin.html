<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - CajaViva</title>
<style>
  :root {
    --bg: #FAFAF7; --panel: #FFFFFF; --line: #E4E2DA;
    --text: #2C2C2A; --muted: #6E6D67;
    --accent: #1D9E75; --accent-dark: #0F6E56; --accent-soft: #E1F5EE;
    --danger: #C0392B;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 15px;
  }
  header {
    background: var(--accent); color: #fff; padding: 18px;
    border-radius: 0 0 18px 18px;
  }
  .marca { font-size: 19px; font-weight: 500; }
  .sub { font-size: 13px; opacity: .85; margin-top: 2px; }

  .cont { max-width: 760px; margin: 0 auto; padding: 16px 14px 40px; }

  .resumen {
    display: flex; gap: 10px; margin-bottom: 14px;
  }
  .resumen div {
    flex: 1; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 12px;
  }
  .resumen .lbl { font-size: 11px; color: var(--muted); }
  .resumen .val { font-size: 19px; font-weight: 500; margin-top: 1px; }

  .fila {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 12px;
  }
  .fila.aprobado { border-color: var(--accent); background: var(--accent-soft); }
  .fila .info { flex: 1; min-width: 0; }
  .fila .n { font-size: 14.5px; font-weight: 500; }
  .fila .d { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .fila .d a { color: var(--accent-dark); }
  .fila button {
    flex-shrink: 0; padding: 8px 14px; border-radius: 9px;
    border: 1px solid var(--accent); background: var(--accent);
    color: #fff; font-size: 12.5px; font-weight: 500;
  }
  .fila button.quitar {
    background: var(--panel); color: var(--muted); border-color: var(--line);
  }
  .vacio { text-align: center; color: var(--muted); padding: 40px; }
  .msg { background: #FBEAEA; color: var(--danger); padding: 12px; border-radius: 10px; }
</style>
</head>
<body>

<header>
  <div class="cont" style="padding:0 4px;">
    <div class="marca">Admin</div>
    <div class="sub">Negocios en el directorio</div>
  </div>
</header>

<div class="cont" id="pantallaLogin" style="max-width:340px; padding-top:40px;">
  <div style="background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px;">
    <div style="font-size:16px; font-weight:500; margin-bottom:16px;">Entrar al panel</div>
    <div id="msgLogin"></div>
    <input type="text" id="admUsuario" placeholder="Usuario" autocomplete="username"
      style="width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px; font-size:15px; margin-bottom:10px;">
    <input type="password" id="admClave" placeholder="Clave" autocomplete="current-password"
      style="width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px; font-size:15px;">
    <button id="btnEntrarAdm"
      style="width:100%; padding:13px; margin-top:14px; border:none; border-radius:10px; background:var(--accent); color:#fff; font-size:15px; font-weight:500;">Entrar</button>
  </div>
</div>

<div class="cont" id="pantallaAdmin" style="display:none;">
  <div class="resumen">
    <div><div class="lbl">Aprobados</div><div class="val" id="nAprob">0</div></div>
    <div><div class="lbl">Con catalogo</div><div class="val" id="nTotal">0</div></div>
  </div>
  <div id="lista"><div class="vacio">Cargando...</div></div>
</div>

<script>
let tokenAdmin = sessionStorage.getItem('adm_token') || '';
let negocios = [];

function esc(t) {
  const d = document.createElement('div');
  d.textContent = t == null ? '' : t;
  return d.innerHTML;
}

async function api(metodo, ruta, cuerpo) {
  const r = await fetch('/api' + ruta, {
    method: metodo,
    headers: { 'Content-Type': 'application/json', 'X-Admin': tokenAdmin },
    body: cuerpo ? JSON.stringify(cuerpo) : undefined
  });
  const d = await r.json();
  if (!r.ok) throw new Error(d.error || 'Error');
  return d;
}

document.getElementById('btnEntrarAdm').onclick = async function () {
  const btn = this;
  btn.disabled = true; btn.textContent = 'Entrando...';
  try {
    const r = await fetch('/api/catalogo/admin/entrar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        usuario: document.getElementById('admUsuario').value.trim(),
        clave: document.getElementById('admClave').value
      })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || 'No se pudo entrar');

    tokenAdmin = d.token;
    sessionStorage.setItem('adm_token', tokenAdmin);
    document.getElementById('pantallaLogin').style.display = 'none';
    document.getElementById('pantallaAdmin').style.display = 'block';
    cargar();
  } catch (e) {
    document.getElementById('msgLogin').innerHTML =
      '<div class="msg" style="margin-bottom:12px;">' + esc(e.message) + '</div>';
  }
  btn.disabled = false; btn.textContent = 'Entrar';
};

document.getElementById('admClave').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') document.getElementById('btnEntrarAdm').click();
});

async function cargar() {
  if (!tokenAdmin) return;

  try {
    const d = await api('GET', '/catalogo/admin/negocios');
    negocios = d.negocios;
    pintar();
  } catch (e) {
    document.getElementById('lista').innerHTML = '<div class="msg">' + esc(e.message) + '</div>';
  }
}

function pintar() {
  document.getElementById('nAprob').textContent =
    negocios.filter(function (n) { return n.en_directorio; }).length;
  document.getElementById('nTotal').textContent = negocios.length;

  if (negocios.length === 0) {
    document.getElementById('lista').innerHTML = '<div class="vacio">No hay negocios.</div>';
    return;
  }

  document.getElementById('lista').innerHTML = negocios.map(function (n) {
    return '<div class="fila' + (n.en_directorio ? ' aprobado' : '') + '">' +
      '<div class="info">' +
      '<div class="n">' + esc(n.nombre || 'Sin nombre') + '</div>' +
      '<div class="d">' + esc(n.rubro || '-') + ' - ' + n.productos + ' productos - ' +
      '<a href="/c/' + esc(n.slug) + '" target="_blank">ver</a></div>' +
      '</div>' +
      '<button class="' + (n.en_directorio ? 'quitar' : '') + '" ' +
      'onclick="cambiar(\'' + esc(n.slug) + '\', ' + (n.en_directorio ? 'false' : 'true') + ')">' +
      (n.en_directorio ? 'Quitar' : 'Aprobar') + '</button>' +
      '</div>';
  }).join('');
}

async function cambiar(slug, aprobar) {
  try {
    await api('PUT', '/catalogo/admin/aprobar', { slug: slug, aprobar: aprobar });
    await cargar();
  } catch (e) { alert(e.message); }
}

if (tokenAdmin) {
  document.getElementById('pantallaLogin').style.display = 'none';
  document.getElementById('pantallaAdmin').style.display = 'block';
  cargar();
}
</script>
</body>
</html>
